name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk BulkMailer.apk

      - uses: actions/upload-artifact@v4
        with:
          name: BulkMailer-apk
          path: BulkMailer.apk

      # Publishes the APK at a fixed link: /releases/latest/download/BulkMailer.apk
      - name: Publish download link
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Bulk Mailer (latest build)
          make_latest: true
          files: BulkMailer.apk
